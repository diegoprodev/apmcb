# Config do Supabase CLI para o projeto apmcb.
# Referência: https://supabase.com/docs/guides/local-development/cli/config
# project_id é só um identificador local (nome dos containers do stack local),
# NÃO precisa bater com o project ref remoto. O vínculo com o projeto remoto
# é feito via `supabase link --project-ref <ref>` (grava em supabase/.temp, gitignored).
project_id = "apmcb"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://apmcb.pmpb.online"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true

[analytics]
enabled = false
