name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared
        run: pnpm --filter @apmcb/shared typecheck

      - name: Typecheck BFF
        run: pnpm --filter @apmcb/bff typecheck

      - name: Test BFF (inclui regressão IDOR de tenant scoping)
        run: pnpm --filter @apmcb/bff test
        env:
          # Valores dummy — o singleton services/supabase.ts faz fail-fast no
          # import se faltarem. Os testes que tocam o Supabase fazem
          # monkey-patch do cliente; nenhuma conexão real é feita.
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          SESSION_SECRET: dummy-session-secret-at-least-32-characters
          INTERNAL_EMAIL_SECRET: dummy-internal-email-secret-ci
          EMAIL_DEDUP_PEPPER: dummy-dedup-pepper-ci

      - name: Gate OBS17 — zero console.* no BFF (usar lib/logger)
        run: pnpm --filter @apmcb/bff lint:logs

      - name: Typecheck web
        run: pnpm --filter @apmcb/web typecheck

      - name: Lint web
        run: pnpm --filter @apmcb/web lint

      - name: Unit tests web
        run: pnpm --filter @apmcb/web test:unit

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        # Env vars are set in Cloudflare Pages dashboard — not needed here for CI check
        run: pnpm --filter @apmcb/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_BFF_URL: "https://placeholder.com"
