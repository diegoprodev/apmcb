name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Menor privilégio para o GITHUB_TOKEN — nenhum job escreve no repositório.
permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared
        run: pnpm --filter @apmcb/shared typecheck

      - name: Typecheck BFF
        run: pnpm --filter @apmcb/bff typecheck

      - name: Test BFF (inclui regressão IDOR de tenant scoping)
        run: pnpm --filter @apmcb/bff test
        env:
          # Valores dummy — o singleton services/supabase.ts faz fail-fast no
          # import se faltarem. Os testes que tocam o Supabase fazem
          # monkey-patch do cliente; nenhuma conexão real é feita.
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          SESSION_SECRET: dummy-session-secret-at-least-32-characters
          INTERNAL_EMAIL_SECRET: dummy-internal-email-secret-ci
          EMAIL_DEDUP_PEPPER: dummy-dedup-pepper-ci

      - name: Integração BFF — handlers reais com Supabase simulado (bun)
        # Montam o app Hono real e fazem monkey-patch do cliente Supabase
        # (nenhuma conexão real). Rodam em bun porque os imports relativos sem
        # extensão não resolvem em `node --test`. Antes só rodavam na máquina
        # de quem lembrasse — e são a prova de comportamento (não só de
        # fiação) de rotas como a de saída/devolução. bun 1.4.2 (não o 1.2 da
        # imagem de produção): node:test com describe aninhado só existe no
        # bun >= 1.3. O mesmo passo roda em ci-cd.yml como gate do deploy.
        working-directory: apps/bff
        run: npx -y bun@1.4.2 test src/__tests__/integration
        env:
          AMBIENTE_INFRA: SUPABASE
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          SESSION_SECRET: dummy-session-secret-at-least-32-characters
          EMAIL_CHANGE_TOKEN_SECRET: dummy-email-change-token-secret-ci
          INTERNAL_EMAIL_SECRET: dummy-internal-email-secret-ci
          EMAIL_DEDUP_PEPPER: dummy-dedup-pepper-ci

      - name: Gate OBS17 — zero console.* no BFF (usar lib/logger)
        run: pnpm --filter @apmcb/bff lint:logs

      - name: Typecheck web
        run: pnpm --filter @apmcb/web typecheck

      - name: Lint web
        run: pnpm --filter @apmcb/web lint

      - name: Unit tests web
        run: pnpm --filter @apmcb/web test:unit

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        # Env vars are set in Cloudflare Pages dashboard — not needed here for CI check
        run: pnpm --filter @apmcb/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_BFF_URL: "https://placeholder.com"
