name: CI/CD — APMCB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # E2E Suite completo (CRUD + jornadas) NÃO roda mais a cada push — ele bate
  # em produção com ~180 testes + retries e, sem usuários reais, era ~toda a
  # cota de 100k invocações/dia de Function do CF Pages (achado 2026-09-09).
  # Agora: nightly + on-demand. O `e2e-smoke` (rápido) continua a cada push
  # como sanidade de deploy.
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC diário
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio para o GITHUB_TOKEN (os segredos de deploy vêm de secrets,
# não do token). Nenhum job escreve no repositório.
permissions:
  contents: read

jobs:
  # ── 1. Type check ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @apmcb/shared build
      - run: cd apps/bff && npx tsc --noEmit
      - run: cd apps/web && npx tsc --noEmit
      # Invariante do isolamento por reserva (F2/RT-04): sem assinante Realtime autenticado no web.
      - run: bash scripts/ci/no-authed-realtime.sh

  # ── 1b. Testes do BFF (gate do deploy) ───────────────────────────────────────
  # Achado de revisão (2026-09-29): o deploy só esperava o tsc; os testes do
  # BFF rodavam em ci.yml em paralelo e um vermelho aparecia com o BFF já em
  # produção. Agora deploy-bff depende deste job. Mesma env fictícia de ci.yml
  # (o singleton do Supabase faz fail-fast sem ela; nenhuma conexão real).
  bff-tests:
    name: BFF Tests (unit + integração)
    runs-on: ubuntu-latest
    env:
      AMBIENTE_INFRA: SUPABASE
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SESSION_SECRET: dummy-session-secret-at-least-32-characters
      EMAIL_CHANGE_TOKEN_SECRET: dummy-email-change-token-secret-ci
      INTERNAL_EMAIL_SECRET: dummy-internal-email-secret-ci
      EMAIL_DEDUP_PEPPER: dummy-dedup-pepper-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @apmcb/shared build
      - run: pnpm --filter @apmcb/bff test
      # bun 1.4.2 (não o 1.2 da imagem de produção): os testes usam node:test
      # com describe aninhado, que só existe no bun >= 1.3. Alinhar a imagem de
      # produção é tarefa própria, validada no deploy.
      - run: cd apps/bff && npx -y bun@1.4.2 test src/__tests__/integration

  # ── 2. E2E Smoke ─────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    # needs deploy-bff (não só typecheck) — achado real 2026-07-17: como
    # e2e-smoke bate direto em produção (E2E_BASE_URL abaixo) e antes só
    # dependia de typecheck, ele podia rodar EM PARALELO com o deploy
    # blue/green do BFF, batendo login bem na janela de troca de
    # container/nginx reload — "BFF unreachable or tokens rejected"
    # (harness.ts:128-131) mesmo sem nenhuma regressão real de código.
    needs: [typecheck, deploy-bff]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Cache Playwright browsers entre runs (a chave inclui versão do Playwright)
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      # Instala browsers apenas se não estiverem em cache
      # Roda dentro de apps/web para garantir o path correto
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd apps/web && pnpm exec playwright install chromium --with-deps

      # Se cache hit, ainda instala dependências de sistema (sem re-baixar browsers)
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd apps/web && pnpm exec playwright install-deps chromium

      - name: Run smoke tests
        run: cd apps/web && pnpm exec playwright test --project=chromium --timeout=60000
        env:
          E2E_BASE_URL: https://apmcb.pmpb.online
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_BFF_URL: ${{ secrets.E2E_BFF_URL }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ── 2a. Reserve Isolation CI Gates (SP3) ────────────────────────────────────
  # Roda contra PROD pós-deploy (junto do smoke, não em staging — prod tem
  # drift real, migrações via MCP; staging não reflete grants reais, ver
  # docs/superpowers/specs/2026-09-09-isolamento-reserva-design.md §7/§8).
  # RPCs SECURITY DEFINER só-leitura (supabase/migrations/20260911131947_*):
  # allowlist de grants anon/authenticated, RLS habilitada em toda tabela
  # public, reserve_id NOT NULL nas 7 filhas do SP4, diff de policy contra
  # supabase/ci/policy-snapshot.json, functions com p_reserve_id guardadas
  # por assert_actor_in_reserve/assert_device_in_reserve (prepara o SP8).
  reserve-isolation-gates:
    name: Reserve Isolation CI Gates
    runs-on: ubuntu-latest
    # Só depende de typecheck (não de deploy-bff) — este job fala direto com
    # o Supabase via RPC, nunca com o BFF. Acoplar a deploy-bff faria uma
    # falha de deploy pular silenciosamente a verificação de drift de RLS
    # (achado A3 do review, 2026-09-11).
    needs: [typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/bff && pnpm run ci:reserve-gates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── 2b. E2E Suite — CRUD/jornadas básicas (criar, editar, desativar, notificações) ──
  # Antes só o smoke (41 testes) rodava em CI; o projeto "suite" (148 testes,
  # cobre crud-usuarios/arsenal/saidas, regression, TOTP, notificações) só era
  # disparado manualmente. Foi assim que um bug de coluna inexistente em
  # PATCH /api/profiles/:id (editar/desativar usuário, 500 há 2+ semanas) passou
  # despercebido — o teste que pegaria isso (crud-usuarios.spec.ts U4/U11) existe
  # desde sempre, só nunca rodou automaticamente.
  e2e-suite:
    name: E2E Suite (CRUD + jornadas)
    runs-on: ubuntu-latest
    # needs e2e-smoke (não só typecheck): ambos rodam contra o MESMO banco de
    # produção usando as mesmas contas fixture (admin@apmcb.dev, armeiro@...,
    # cadete@...). Rodar em paralelo arriscaria U4/U11 de crud-usuarios.spec.ts
    # (que editam uma linha arbitrária da grid, não um usuário descartável)
    # colidirem com apmcb.spec.ts logando/mutando essas mesmas contas.
    #
    # Só nightly (schedule) ou disparo manual (workflow_dispatch) — NÃO a cada
    # push. Sem usuários reais, rodar a suíte completa contra produção a cada
    # merge consumia ~toda a cota diária de Function do CF Pages. Antes de um
    # merge sensível: `gh workflow run "CI/CD — APMCB"`.
    needs: [typecheck]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd apps/web && pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd apps/web && pnpm exec playwright install-deps chromium

      - name: Run CRUD/journeys suite
        run: cd apps/web && pnpm exec playwright test --project=suite --project=sidebar-nav --timeout=60000
        env:
          E2E_BASE_URL: https://apmcb.pmpb.online
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_BFF_URL: ${{ secrets.E2E_BFF_URL }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-suite
          path: apps/web/playwright-report/
          retention-days: 7

  # ── 3. Deploy BFF no VPS — Blue/Green com rollback automático ────────────────
  deploy-bff:
    name: Deploy BFF (VPS)
    runs-on: ubuntu-latest
    needs: [typecheck, bff-tests]
    # Só em push na main — schedule/workflow_dispatch (E2E Suite nightly) não
    # redeploya o BFF.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH (blue/green + health check + rollback)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: 91.99.113.89
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/apmcb
            git fetch origin main
            git reset --hard origin/main

            # Salva a imagem atual como rollback antes de substituir
            CURRENT_IMG=$(docker inspect --format='{{.Config.Image}}' apmcb-bff 2>/dev/null || true)
            if [ -n "$CURRENT_IMG" ]; then
              docker tag "$CURRENT_IMG" apmcb-bff:rollback
              echo "Rollback image tagged: $CURRENT_IMG"
            fi

            # Build nova imagem
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build bff

            # Garante liberação completa da porta 3001 antes de subir novo container
            # 1. Stop via compose (aguarda processo encerrar antes de liberar binding)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml stop bff 2>/dev/null || true
            # 2. Remove o container por nome
            docker rm -f apmcb-bff 2>/dev/null || true
            # 3. Mata orphan containers em qualquer estado que usem a porta 3001
            #    Nota: filtro "publish" usa só a porta, sem IP (127.0.0.1: causa erro)
            for CID in $(docker ps -aq --filter "publish=3001"); do
              docker stop "$CID" 2>/dev/null || true
              docker rm -f "$CID" 2>/dev/null || true
            done
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate --remove-orphans bff

            # Health check: espera até 60s (20 tentativas × 3s)
            HEALTHY=false
            for i in $(seq 1 20); do
              sleep 3
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' apmcb-bff 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              echo "Aguardando health check... tentativa $i/20 (status: $STATUS)"
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "ERRO: health check falhou — iniciando rollback automático"
              docker rm -f apmcb-bff 2>/dev/null || true
              if docker image inspect apmcb-bff:rollback >/dev/null 2>&1; then
                docker run -d \
                  --name apmcb-bff \
                  --restart unless-stopped \
                  --network apmcb_apmcb-net \
                  -p 127.0.0.1:3001:3001 \
                  --env-file /var/www/apmcb/.env \
                  apmcb-bff:rollback
                echo "Rollback concluído — versão anterior restaurada"
              else
                echo "CRÍTICO: sem imagem de rollback disponível"
              fi
              exit 1
            fi

            echo "BFF deployed successfully at $(date)"

  # ── 4. Summary ───────────────────────────────────────────────────────────────
  notify:
    name: Deploy Status
    runs-on: ubuntu-latest
    needs: [typecheck, e2e-smoke, e2e-suite, deploy-bff, reserve-isolation-gates]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Achado real (2026-08-29): "TypeCheck: ✅" era hardcoded — se o
      # typecheck falhasse, e2e-smoke/e2e-suite/deploy-bff nem rodariam
      # (dependem dele), mas o summary continuaria mostrando ✅ pro
      # typecheck mesmo tendo sido a causa raiz do resto ficar "skipped".
      - name: Summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- TypeCheck: ${{ needs.typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Smoke: ${{ needs.e2e-smoke.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Suite (CRUD/jornadas): ${{ needs.e2e-suite.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- BFF Deploy: ${{ needs.deploy-bff.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Reserve Isolation CI Gates: ${{ needs.reserve-isolation-gates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CF Pages: triggered automatically on push to main" >> $GITHUB_STEP_SUMMARY

      # Achado real do usuário (2026-08-29): nenhum job deste pipeline
      # alertava ninguém de verdade — o summary acima só existe se alguém
      # abrir a run manualmente na aba Actions. 1ª tentativa (Issue automática
      # no repo via GITHUB_TOKEN) foi rejeitada pelo usuário — não quer nada
      # criado no repositório, só e-mail. Sem SMTP configurado (exigiria
      # secrets novos: host/usuário/senha de um serviço de e-mail — ninguém
      # forneceu isso), a única forma de notificação por e-mail sem
      # infraestrutura nova é a nativa do GitHub: Settings → Notifications →
      # "Actions" → marcar "Send notifications for failed workflows only" (ou
      # "for all workflows") na conta que tem push nesta branch. Isso já
      # manda e-mail pro endereço da conta GitHub sem precisar de nenhuma
      # mudança neste workflow — não há gatilho de código pra isso, é
      # configuração de conta. Se um serviço de e-mail (SMTP/SendGrid/etc)
      # for configurado no futuro, um passo com `dawidd6/action-send-mail`
      # (ou similar) pode substituir esta nota.
