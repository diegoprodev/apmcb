version: "3.9"

services:
  bff:
    build:
      context: ./apps/bff
      dockerfile: Dockerfile
    container_name: apmcb-bff
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      WEB_URL: ${WEB_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      # Fail Fast no boot: totp.ts e index.ts exigem estas vars em NODE_ENV=production
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FINGERPRINT_SDK: ${FINGERPRINT_SDK:-zkteco}
      ZKTECO_LIB_PATH: ${ZKTECO_LIB_PATH:-/usr/lib/libzkfp.so}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # E-mail transacional (Resend) — ver docs/email-transacional.md.
      # Sem RESEND_API_KEY / EMAIL_ENABLED=false: sendEmail vira no-op logado
      # (fail-soft, NÃO derruba o boot). FRONTEND_URL é usado nos links dos
      # templates. INTERNAL_EMAIL_SECRET (distinto de INTERNAL_API_SECRET)
      # autentica web→BFF em /api/internal/email.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-APMCB}
      FRONTEND_URL: ${FRONTEND_URL:-https://apmcb.pmpb.online}
      INTERNAL_EMAIL_SECRET: ${INTERNAL_EMAIL_SECRET:-}
      EMAIL_DEDUP_PEPPER: ${EMAIL_DEDUP_PEPPER:-}
      EMAIL_DAILY_CAP: ${EMAIL_DAILY_CAP:-60}
      EMAIL_RATE_MAX: ${EMAIL_RATE_MAX:-20}
      # Fase 3 — pepper do fingerprint de dispositivo (known_login_devices /
      # alerta new_login). Sem ele, recordLoginDevice vira no-op logado.
      LOGIN_DEVICE_HASH_PEPPER: ${LOGIN_DEVICE_HASH_PEPPER:-}
    volumes:
      - bff_logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - apmcb-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bff_logs:

networks:
  apmcb-net:
    driver: bridge
